<svg width="680" height="470" viewBox="0 0 680 470" xmlns="http://www.w3.org/2000/svg" role="img">
<title>ShopSphere production architecture</title>
<desc>Browser sends HTTPS requests to the React frontend on Vercel, which calls the Express backend (Vercel serverless functions) over HTTPS. The backend reads and writes PostgreSQL on Supabase via Prisma, and MongoDB Atlas via Mongoose.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#3d3d3a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<rect width="680" height="470" fill="#ffffff"/>

<g>
<rect x="240" y="30" width="200" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="52" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Browser (client)</text>
</g>

<line x1="340" y1="74" x2="340" y2="110" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="356" y="96" font-family="sans-serif" font-size="12" fill="#5F5E5A">HTTPS</text>

<g>
<rect x="240" y="110" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="130" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Frontend</text>
<text x="340" y="148" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">React, Vercel</text>
</g>

<line x1="340" y1="166" x2="340" y2="204" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="356" y="189" font-family="sans-serif" font-size="12" fill="#5F5E5A">REST API</text>

<g>
<rect x="240" y="204" width="200" height="56" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text x="340" y="224" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#0C447C">Backend</text>
<text x="340" y="242" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#185FA5">Express, Vercel functions</text>
</g>

<path d="M280 260 L280 300 L180 300 L180 330" fill="none" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="70" y="316" font-family="sans-serif" font-size="12" fill="#5F5E5A">Prisma (SQL)</text>

<path d="M400 260 L400 300 L500 300 L500 330" fill="none" stroke="#3d3d3a" stroke-width="1.5" marker-end="url(#arrow)"/>
<text x="480" y="316" font-family="sans-serif" font-size="12" fill="#5F5E5A">Mongoose</text>

<g>
<rect x="80" y="330" width="200" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="180" y="350" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#085041">PostgreSQL</text>
<text x="180" y="368" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#0F6E56">Supabase, production DB</text>
</g>

<g>
<rect x="400" y="330" width="200" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="500" y="350" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#712B13">MongoDB</text>
<text x="500" y="368" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#993C1D">Atlas, reviews and logs</text>
</g>

<text x="340" y="430" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">Blue = Vercel hosting, Teal = relational data, Coral = document data</text>
</svg>
