apiVersion: v1
kind: Pod
metadata:
  name: shopsphere-frontend
  labels:
    app: shopsphere-frontend
spec:
  containers:
    - name: frontend
      image: shopsphere-frontend:local
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-frontend-svc
spec:
  selector:
    app: shopsphere-frontend
  ports:
    - port: 80
      targetPort: 80
