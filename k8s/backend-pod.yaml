apiVersion: v1
kind: Pod
metadata:
  name: shopsphere-backend
  labels:
    app: shopsphere-backend
spec:
  containers:
    - name: backend
      image: shopsphere-backend:local
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 5000
      env:
        - name: PORT
          value: "5000"
        - name: JWT_SECRET
          value: "simulation_secret"
        # Dummy connection strings - this pod only needs to boot and answer
        # HTTP requests for the namespace simulation; it is not wired to a
        # real production database (that connection lives in the Task 1
        # deployment on Vercel). In a real multi-cloud rollout these would
        # come from a Kubernetes Secret, not a plain env value.
        - name: DATABASE_URL
          value: "postgresql://user:pass@localhost:5432/shopdb"
        - name: MONGO_URI
          value: "mongodb://localhost:27017/shop"
---
apiVersion: v1
kind: Service
metadata:
  name: shopsphere-backend-svc
spec:
  selector:
    app: shopsphere-backend
  ports:
    - port: 5000
      targetPort: 5000
